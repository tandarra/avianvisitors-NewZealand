<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bird Atlas</title>
<meta name="description" content="Kachō-e style bird illustrations by region. Pick a country to see its checklist and what's been painted.">
<style>
:root{--paper:#efebe1;--paper2:#f6f3ea;--land:#e2dac7;--ink:#141414;--ink2:#3a352c;--mute:#6b665c;--line:#d6d0c2;
--ok:#2f6b3a;--part:#a8741a;--miss:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{border-bottom:3px solid var(--ink);padding:22px 0 14px;position:relative;overflow:hidden}
header.top h1{margin:0;font-size:34px;letter-spacing:.01em}
.kicker,.sub{font:12px 'Courier New',monospace;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.sub{margin-top:6px}
header.top img.flier{position:absolute;right:8px;top:6px;height:88px;mix-blend-mode:multiply;transform:scaleX(-1);opacity:.95}
.mapbox{margin:18px 0 10px;border:1px solid var(--ink2);background:var(--paper2);padding:10px;position:relative}
.mapbox::after{content:"";position:absolute;inset:4px;border:1px solid var(--line);pointer-events:none}
#mapwrap{position:relative;width:100%;aspect-ratio:1000/439;overflow:hidden}
#mapwrap svg{width:100%;height:100%;display:block}
.sea{fill:url(#waves);stroke:var(--ink2);stroke-width:.8}
.grat{fill:none;stroke:#b9b09c;stroke-width:.35;stroke-dasharray:2 3}
#land path{fill:var(--land);stroke:var(--ink2);stroke-width:.35;stroke-linejoin:round;transition:stroke-width .2s,fill .2s,filter .2s}
#land path.hov{stroke:var(--ink);stroke-width:1.6;fill:#efe6cf;filter:drop-shadow(0 1.5px 0 rgba(20,20,20,.35))}
#land path.live.hov{stroke:var(--ink);stroke-width:1.8;filter:drop-shadow(0 1.5px 0 rgba(20,20,20,.35))}
.bird,.bird-shadow{pointer-events:none;opacity:0;transition:opacity .35s}
.bird.up{opacity:1}.bird-shadow.up{opacity:var(--o,.2)}
.bird{filter:drop-shadow(0 .5px 0 rgba(20,20,20,.25))}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--paper2);border:1px solid var(--ink);
padding:4px 8px;font:11px 'Courier New',monospace;color:var(--mute);white-space:nowrap;z-index:2;box-shadow:2px 2px 0 rgba(20,20,20,.2)}
.tip b{display:block;font:700 14px Georgia,serif;color:var(--ink)}

.hit{fill:transparent;cursor:pointer}
.hit.isle{fill:rgba(239,235,225,.6);stroke:var(--ink2);stroke-width:.6}.hit.isle.live{fill:var(--fill);stroke:var(--ink)}
.hit.isle:hover{stroke-width:1.4;stroke:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:12px 'Courier New',monospace;color:var(--mute);align-items:center;margin:2px 0 6px}
#land path.live{fill:var(--fill);stroke:var(--ink);stroke-width:.7;cursor:pointer}
.legend{margin:4px 0 28px;gap:8px}.legend .ramp{display:inline-block;width:160px;height:10px;border:1px solid var(--ink)}
.legend .hint{margin-left:auto}
.world{margin:16px 0 0}.world .wl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.world b{font-size:22px}.world span{font:12px 'Courier New',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.world .bar{position:relative;margin:8px 0 0}.world .bar i{position:absolute;left:0;top:0}.world .bar i.half{background:#a8a093}
.find{margin:14px 0 0;display:flex;gap:8px}
.find input{flex:1;max-width:360px;font:15px Georgia,serif;padding:7px 10px;border:1px solid var(--ink);background:var(--paper2);color:var(--ink)}
.pick{border:1px solid var(--ink2);background:var(--paper2);padding:12px 14px;margin:0 0 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pick b{font-size:20px}.pick .m{font:12px 'Courier New',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.pick .bar{flex:1 1 200px;margin:0}.pick button{font:13px 'Courier New',monospace;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 12px;cursor:pointer}
#land path.has{cursor:pointer}
#land path.sel{stroke:var(--ink);stroke-width:1.8}
.ghost{font:12px 'Courier New',monospace;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer}
.ghost:hover{background:#fff8ec}
.world .acts{display:flex;gap:8px;margin-top:8px}
.mapbox{position:relative}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{width:30px;height:30px;font:16px Georgia,serif;border:1px solid var(--ink);background:var(--paper2);color:var(--ink);cursor:pointer;line-height:1}
#mapwrap svg{touch-action:none;cursor:grab}#mapwrap svg.drag{cursor:grabbing}
.rank{margin:0 0 30px}.rank .rh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.rank h3{margin:0;font-size:20px}.rank .seg{display:flex;gap:4px}
.rank table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:15px}
.rank td,.rank th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rank th{font:11px 'Courier New',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.rank .num{text-align:right;font-family:'Courier New',monospace;font-size:13px;white-space:nowrap}
.rank tbody tr{cursor:pointer}.rank tbody tr:hover{background:#fff8ec}
.rank .barc{width:30%}.rank .barc .bar{margin:0}
.rank td:first-child{font:12px 'Courier New',monospace;color:var(--mute);width:2.5em}
.c{cursor:pointer}.c:hover{border-color:var(--ink2);background:#fff8ec}
select{font:13px 'Courier New',monospace;border:1px solid var(--ink);background:transparent;padding:5px 6px;color:var(--ink)}
dialog{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:0;max-width:min(860px,94vw);width:100%;box-shadow:6px 6px 0 rgba(20,20,20,.25)}
dialog::backdrop{background:rgba(20,20,20,.45)}
.spin{padding:22px;position:relative}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font:28px Georgia,serif;cursor:pointer;color:var(--ink)}
.spimgs{display:flex;gap:18px;align-items:center;justify-content:center;min-height:260px;background:var(--paper2);border:1px solid var(--line);padding:16px}
.spimgs figure{margin:0;text-align:center;flex:1}
.spimgs img{max-width:100%;max-height:300px;object-fit:contain;mix-blend-mode:multiply}
.spimgs figcaption,.m{font:12px 'Courier New',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.spimgs .ph{width:180px;height:180px;margin:auto}
.spbody h3{margin:14px 0 2px;font-size:26px}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font:12px 'Courier New',monospace;border:1px solid var(--ink);padding:5px 9px;text-decoration:none}
.links a:hover{background:#fff8ec}
.spnav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.spnav button{font:18px Georgia,serif;border:1px solid var(--ink);background:transparent;width:40px;height:34px;cursor:pointer}
#pn h3{margin:0 0 4px;font-size:22px}
#pncmd{width:100%;font:13px 'Courier New',monospace;background:var(--paper2);border:1px solid var(--ink2);padding:8px;resize:none;color:var(--ink)}
#pnlist{columns:2 260px;font-size:14px;margin:12px 0 0;padding-left:28px}#pnlist li{margin:0 0 4px;break-inside:avoid}
#pnlist small{color:var(--mute);font:11px 'Courier New',monospace}
/* checklist panel */
#panel[hidden]{display:none}
#panel header{position:sticky;top:0;background:var(--paper);border-bottom:3px solid var(--ink);padding:14px 0 12px;z-index:3}
#panel h2{margin:0;font-size:28px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
#panel h2 small{font:12px 'Courier New',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:400}
.bar{height:10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.f,input,button.back{font:13px 'Courier New',monospace;border:1px solid var(--ink);background:transparent;padding:5px 10px;color:var(--ink);cursor:pointer}
button.f.on{background:var(--ink);color:var(--paper)}
input{flex:1;min-width:160px;cursor:text}
button.back{margin-right:4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:16px 0 40px}
.c{border:1px solid var(--line);background:var(--paper2);padding:10px;display:flex;flex-direction:column;gap:6px}
.imgs{display:flex;gap:4px;height:84px;align-items:center;justify-content:center}
.imgs img{max-height:84px;max-width:50%;object-fit:contain;mix-blend-mode:multiply}
.ph{width:60px;height:60px;border:1px dashed var(--line)}
.n{font-weight:700;font-size:15px;line-height:1.15}.s{font-style:italic;font-size:12px;color:var(--mute)}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips span{font:10px 'Courier New',monospace;border:1px solid currentColor;padding:1px 5px;text-transform:uppercase}
.ok{color:var(--ok)}.part{color:var(--part)}.miss{color:var(--miss)}
.empty{font:13px 'Courier New',monospace;color:var(--mute);padding:20px 0}
footer{border-top:1px solid var(--line);padding:14px 0 30px;font:12px 'Courier New',monospace;color:var(--mute)}
@media (max-width:640px){header.top h1{font-size:26px}header.top img.flier{height:60px}.legend .hint{margin-left:0;width:100%}
  .pick{position:sticky;bottom:0;z-index:6;margin:0 -20px 20px;border-width:2px 0 0;box-shadow:0 -4px 12px rgba(20,20,20,.15)}
  .rank .barc{display:none}.spimgs{flex-direction:column;min-height:0}.spimgs img{max-height:200px}
  .zoom{right:12px;bottom:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">Kachō-e field guides</div>
    <h1>Bird Atlas</h1>
    <div class="sub" id="tag">Click a country to open its checklist</div>
    <img class="flier" src="birds/prosthemadera-novaeseelandiae-2.webp" alt="">
  </header>

  <section id="atlas">
    <div class="world" id="world" hidden>
      <div class="wl"><b id="wnum"></b><span id="wtxt"></span></div>
      <div class="bar"><i id="wbar"></i><i id="wbar2" class="half"></i></div>
      <div class="acts"><button class="ghost" id="wnext">Paint next &rarr;</button><button class="ghost" id="wshare">Share card</button></div>
    </div>
    <div class="find">
      <input id="find" list="clist" placeholder="Find a country…" aria-label="Find a country" autocomplete="off">
      <datalist id="clist"></datalist>
    </div>
    <div class="mapbox"><div id="mapwrap" aria-busy="true"></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zhome" aria-label="Reset view">&#8634;</button></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="pick" id="pick" hidden></div>
    <section class="rank" id="rank" hidden>
      <div class="rh"><h3>Country rankings</h3>
        <div class="seg"><button class="f on" data-r="pct">% illustrated</button><button class="f" data-r="done">Species painted</button><button class="f" data-r="total">Biggest lists</button></div></div>
      <table><thead><tr><th>#</th><th>Country</th><th class="num">Illustrated</th><th class="num">%</th><th class="barc"></th></tr></thead><tbody id="rbody"></tbody></table>
      <button class="ghost" id="rmore"></button>
    </section>
  </section>

  <section id="panel" hidden>
    <header>
      <h2><span id="pname"></span><small id="psub"></small></h2>
      <div class="bar"><i id="pbar"></i></div>
      <div class="tools">
        <button class="back" id="back">&larr; Map</button>
        <button class="f on" data-f="all">All</button><button class="f" data-f="ok">Complete</button>
        <button class="f" data-f="part">Partial</button><button class="f" data-f="miss">Missing</button>
        <input id="q" placeholder="Search name..." aria-label="Search species">
        <select id="sort" aria-label="Sort species"><option value="az">A–Z</option><option value="tax">eBird order</option>
          <option value="wide">Most widespread</option><option value="miss">Missing first</option></select>
        <button class="ghost" id="pnext">Paint next</button><button class="ghost" id="pshare">Share card</button>
      </div>
    </header>
    <main id="grid"></main>
  </section>

  <dialog id="sp" aria-label="Species"><div class="spin">
    <button class="x" id="spx" aria-label="Close">&times;</button>
    <div class="spimgs" id="spimgs"></div>
    <div class="spbody"><h3 id="spname"></h3><div class="s" id="spsci"></div><div class="chips" id="spchips"></div>
      <p class="m" id="spmeta"></p><div class="links" id="splinks"></div></div>
    <div class="spnav"><button id="spprev" aria-label="Previous">&larr;</button><span id="sppos"></span><button id="spnext" aria-label="Next">&rarr;</button></div>
  </div></dialog>
  <dialog id="pn" aria-label="Paint next"><div class="spin">
    <button class="x" id="pnx" aria-label="Close">&times;</button>
    <h3 id="pnt"></h3><p class="m" id="pnm"></p>
    <div class="tools"><label class="m">How many <select id="pncount"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></label>
      <button class="f on" id="pndl">Download list</button><button class="f" id="pncp">Copy command</button></div>
    <p class="m">Save <b id="pnfile"></b> in Downloads, then run this from Downloads:</p>
    <textarea id="pncmd" readonly rows="2" spellcheck="false">py nz_bird_illustrations.py --list paint_next.txt --style-ref "birds\raw\prosthemadera-novaeseelandiae.png"</textarea>
    <ol id="pnlist"></ol>
  </div></dialog>

  <footer>Illustrations generated in the style of <a href="https://theodore.net/projects/AvianVisitors/">Avian Visitors</a> &middot;
    CC BY-NC-SA 4.0 &middot; Species lists from eBird &middot; Map: Natural Earth &middot;
    <a href="https://github.com/tandarra/avianvisitors-NewZealand">GitHub</a></footer>
</div>

<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
// Data: birds/world.json (eBird world species list + each country's list, built by
// `nz_bird_illustrations.py --world`) and birds/painted.json (cut-outs per species, written by --progress).
// Until world.json exists the atlas falls back to the New Zealand checklist (birds/progress_NZ.json).
const C = {};                 // country code -> {code, name, iso, sp?: [species indexes], prog?: progress json}
let WORLD = null, PAINTED = {};
const NS = "http://www.w3.org/2000/svg";
// Overhead albatross (mollymawk), drawn facing +x: long narrow dark wings, white body, grey head, yellow bill.
const ALBATROSS = `
<g class="wing"><path d="M3,-2.2 C4.6,-8 5.6,-12 5,-15.5 C3.6,-22 0.6,-29 -3.8,-35.5 C-4.6,-36.3 -5.4,-35.6 -5,-34.6
 C-4.2,-28 -4.6,-21 -4.8,-15.8 C-4.9,-10 -4.6,-6 -4.2,-2.2 Z" fill="#2c2a26" stroke="#141414" stroke-width=".5"/>
 <path d="M2.6,-3 C3.8,-8 4.4,-11.5 3.9,-14.6 L-2.6,-14.2 C-3,-10 -3,-6 -2.8,-3 Z" fill="#4a4640"/>
 <path d="M-4.6,-16 C-4.4,-22 -3.6,-28 -4.4,-34" fill="none" stroke="#efebe1" stroke-width=".35" opacity=".45"/></g>
<g class="wing"><path d="M3,2.2 C4.6,8 5.6,12 5,15.5 C3.6,22 0.6,29 -3.8,35.5 C-4.6,36.3 -5.4,35.6 -5,34.6
 C-4.2,28 -4.6,21 -4.8,15.8 C-4.9,10 -4.6,6 -4.2,2.2 Z" fill="#2c2a26" stroke="#141414" stroke-width=".5"/>
 <path d="M2.6,3 C3.8,8 4.4,11.5 3.9,14.6 L-2.6,14.2 C-3,10 -3,6 -2.8,3 Z" fill="#4a4640"/>
 <path d="M-4.6,16 C-4.4,22 -3.6,28 -4.4,34" fill="none" stroke="#efebe1" stroke-width=".35" opacity=".45"/></g>
<path d="M-12.5,-2 L-9,-1.4 L-9,1.4 L-12.5,2 C-13.2,0.8 -13.2,-0.8 -12.5,-2 Z" fill="#3a3732" stroke="#141414" stroke-width=".4"/>
<path d="M9.2,-1.8 C10.6,-1.6 11.4,-0.8 11.6,0 C11.4,0.8 10.6,1.6 9.2,1.8 C3,2.9 -4,3.1 -9.6,1.7 C-10.6,1 -10.6,-1 -9.6,-1.7
 C-4,-3.1 3,-2.9 9.2,-1.8 Z" fill="#f6f3ea" stroke="#141414" stroke-width=".5"/>
<path d="M-3.6,-2.6 C-0.6,-2.9 2.4,-2.7 3.2,-2.2 L3.2,2.2 C2.4,2.7 -0.6,2.9 -3.6,2.6 Z" fill="#3a3732"/>
<path d="M5.2,-2.3 C7.8,-2.2 9.8,-1.6 11,-0.6 L11,0.6 C9.8,1.6 7.8,2.2 5.2,2.3 Z" fill="#b9b7b1"/>
<path d="M11.2,-0.75 C13,-0.6 15,-0.3 16.2,0 C15,0.3 13,0.6 11.2,0.75 Z" fill="#e0a52a" stroke="#141414" stroke-width=".3"/>
<circle cx="10.2" cy="-1.05" r=".38" fill="#141414"/><circle cx="10.2" cy="1.05" r=".38" fill="#141414"/>`;
const $ = s => document.querySelector(s);
const slugOf = sci => sci.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-+|-+$/g, "");
const getJSON = url => fetch(url, {cache: "no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null);
const fmt = n => n.toLocaleString();

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

async function loadData() {
  const [world, painted, nz] = await Promise.all([getJSON("birds/world.json"), getJSON("birds/painted.json"), getJSON("birds/progress_NZ.json")]);
  PAINTED = painted || {};
  if (!painted && nz) nz.birds.forEach(b => { if (b.webp.length) PAINTED[b.slug] = b.webp; });
  if (world) {
    WORLD = world;
    WORLD.slugs = world.species.map(([sci]) => slugOf(sci));
    WORLD.wide = new Uint16Array(world.species.length);           // how many countries record each species
    for (const c of world.countries) for (const i of c.sp) WORLD.wide[i]++;
    for (const c of world.countries) C[c.code] = {code: c.code, name: c.name, iso: c.iso, sp: c.sp};
  } else if (nz) {
    C.NZ = {code: "NZ", name: "New Zealand", iso: "554", prog: nz};
  }
  for (const c of Object.values(C)) c.s = stats(c);
}
function paintState(slug) {
  const w = PAINTED[slug] || [];
  return w.includes(slug + ".webp") && w.includes(slug + "-2.webp") ? "ok" : w.length ? "part" : "miss";
}
function stats(c) {
  if (c.prog) return {total: c.prog.total, done: c.prog.done, part: c.prog.part};
  let done = 0, part = 0;
  for (const i of c.sp) { const st = paintState(WORLD.slugs[i]); if (st === "ok") done++; else if (st === "part") part++; }
  return {total: c.sp.length, done, part};
}
// full checklist for a country, in the shape the panel draws
function checklist(c) {
  if (c.prog) return c.prog;
  const birds = c.sp.map(i => {
    const [sci, com, code] = WORLD.species[i], slug = WORLD.slugs[i], webp = PAINTED[slug] || [];
    return {com, sci, slug, webp, code, idx: i, wide: WORLD.wide[i], status: paintState(slug), pose2: "in flight"};
  }).sort((a, b) => a.com.localeCompare(b.com));
  const s = c.s, images = birds.reduce((n, b) => n + b.webp.length, 0);
  return {total: s.total, done: s.done, part: s.part, miss: s.total - s.done - s.part, images, updated: WORLD.updated, birds};
}

// shade = share of the checklist painted (partials count half): pale wash -> deep vermilion
const SHADE = ["#f1d9cc", "#e3a98f", "#cf7356", "#b8432b", "#8a2a18"];
const frac = p => p.total ? Math.max(0, Math.min(1, (p.done + p.part / 2) / p.total)) : 0;
function shade(p) {
  const t = Math.sqrt(frac(p)) * (SHADE.length - 1);          // square root: a few percent still shows
  const i = Math.min(SHADE.length - 2, Math.floor(t)), f = t - i;
  const c = k => parseInt(SHADE[i].slice(k, k + 2), 16) * (1 - f) + parseInt(SHADE[i + 1].slice(k, k + 2), 16) * f;
  return `rgb(${c(1) | 0},${c(3) | 0},${c(5) | 0})`;
}
const pct = p => { const v = p.total ? p.done / p.total * 100 : 0; return v > 0 && v < 1 ? v.toFixed(1) : Math.round(v); };

// ---------- live map: turns toward the country under the mouse, zooms a touch, inks its border
const W = 1000, ZOOM = 1.18, DWELL = 220;
const calm = matchMedia("(prefers-reduced-motion: reduce)");
// camera: rotation (lam), zoom (k) and the latitude it zooms about; each eases on a spring so a new
// target only changes where it's heading, never restarting the motion
const view = {lam: 0, k: 1, lat: 0, vlam: 0, vk: 0, vlat: 0};
const R2D = 180 / Math.PI, D2R = Math.PI / 180;
const wrapPi = x => Math.atan2(Math.sin(x), Math.cos(x));
const wrap180 = x => ((x + 540) % 360) - 180;

    <div class="n">${b.com}</div><div class="s">${b.sci}</div><div class="chips">
    <span class="${b.webp.includes(b.slug + ".webp") ? "ok" : "miss"}">perched</span>
    <span class="${b.webp.includes(b.slug + "-2.webp") ? "ok" : "miss"}">${b.pose2}</span></div></div>`).join("")
    : '<div class="empty">No species match.</div>';
  $("#grid").querySelectorAll(".c").forEach(c => {
    c.onclick = () => showSpecies(+c.dataset.i);
    c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showSpecies(+c.dataset.i); } };
  });
}
const posesOf = b => [...b.webp].sort((x, y) => (x === b.slug + ".webp" ? -1 : y === b.slug + ".webp" ? 1 : x < y ? -1 : 1));
let spAt = 0;
function showSpecies(i) {
  if (!shown.length) return;
  spAt = (i + shown.length) % shown.length;
  const b = shown[spAt], poses = posesOf(b), names = ["perched", b.pose2, "third pose"];
  $("#spimgs").innerHTML = poses.length ? poses.slice(0, 3).map((w, k) =>
    `<figure><img src="birds/${w}" alt="${b.com}, ${names[k] || "pose"}"><figcaption>${names[k] || "pose"}</figcaption></figure>`).join("")
    : '<figure><div class="ph"></div><figcaption>not painted yet</figcaption></figure>';
  $("#spname").textContent = b.com; $("#spsci").textContent = b.sci;
  $("#spchips").innerHTML = `<span class="${b.webp.includes(b.slug + ".webp") ? "ok" : "miss"}">perched</span>
    <span class="${b.webp.includes(b.slug + "-2.webp") ? "ok" : "miss"}">${b.pose2}</span>`;
  $("#spmeta").textContent = b.wide ? `Recorded by eBird in ${b.wide} ${b.wide === 1 ? "country" : "countries"}` : "";
  const q = encodeURIComponent(b.sci);
  $("#splinks").innerHTML = (b.code ? `<a href="https://ebird.org/species/${b.code}" target="_blank" rel="noopener">eBird</a>
    <a href="https://media.ebird.org/catalog?taxonCode=${b.code}&mediaType=audio" target="_blank" rel="noopener">Calls (Macaulay)</a>`
    : `<a href="https://ebird.org/explore?q=${encodeURIComponent(b.com)}" target="_blank" rel="noopener">eBird</a>`) +
    `<a href="https://xeno-canto.org/explore?query=${q}" target="_blank" rel="noopener">xeno-canto</a>
    <a href="https://en.wikipedia.org/wiki/Special:Search?search=${q}" target="_blank" rel="noopener">Wikipedia</a>`;
  $("#sppos").textContent = `${spAt + 1} of ${shown.length}`;
  if (!$("#sp").open) $("#sp").showModal();
}
$("#spprev").onclick = () => showSpecies(spAt - 1);
$("#spnext").onclick = () => showSpecies(spAt + 1);
$("#spx").onclick = () => $("#sp").close();
$("#sp").addEventListener("keydown", e => { if (e.key === "ArrowLeft") showSpecies(spAt - 1); if (e.key === "ArrowRight") showSpecies(spAt + 1); });
$("#sp").addEventListener("click", e => { if (e.target === $("#sp")) $("#sp").close(); });
$("#sort").onchange = e => { sortBy = e.target.value; draw(); };
$("#pnext").onclick = () => paintNext(curR);
$("#pshare").onclick = () => shareCard(curR);

// ---------- paint next: the unpainted species that would lift the most countries
let pnFor = null;
function paintNext(R) {
  pnFor = R;
  const cnt = +$("#pncount").value;
  let pool;
  if (R) pool = checklist(R).birds;
  else pool = WORLD.species.map(([sci, com, code], i) => ({sci, com, code, slug: WORLD.slugs[i], wide: WORLD.wide[i], status: paintState(WORLD.slugs[i])}));
  const todo = pool.filter(b => b.status !== "ok").sort((a, b) => (b.wide || 0) - (a.wide || 0) || a.com.localeCompare(b.com)).slice(0, cnt);
  const imgs = todo.reduce((n, b) => n + (b.status === "part" ? 1 : 2), 0);
  $("#pnt").textContent = R ? `Paint next for ${R.name}` : "Paint next: biggest worldwide gains";
  $("#pnm").textContent = `${todo.length} species · ${imgs} images · about US$${(imgs * .034).toFixed(2)} on Nano Banana 2.1 · ranked by how many countries record them`;
  $("#pnlist").innerHTML = todo.map(b => `<li>${b.com} <small>${b.wide ? b.wide + " countries" : ""}${b.status === "part" ? " · 1 pose left" : ""}</small></li>`).join("");
  const txt = todo.map(b => `${b.com} (${b.sci})`).join("\r\n") + "\r\n";
  // a unique file name per list: what it covers, how many, and when it was made
  const d = new Date(), z = n => String(n).padStart(2, "0");
  const stamp = `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  const file = `paint_next_${R ? R.code : "world"}_top${todo.length}_${stamp}.txt`;
  $("#pncmd").value = `py nz_bird_illustrations.py --list ${file} --style-ref "birds\\raw\\prosthemadera-novaeseelandiae.png"`;
  $("#pnfile").textContent = file;
  $("#pndl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], {type: "text/plain"}));
    a.download = file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("#pncp").onclick = async () => {
    const box = $("#pncmd"), btn = $("#pncp"), done = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = "Copy command", 1800); };
    try { await navigator.clipboard.writeText(box.value); return done("Copied ✓"); } catch (e) { /* clipboard API blocked */ }
    box.focus(); box.select(); box.setSelectionRange(0, box.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    done(ok ? "Copied ✓" : "Selected: press Ctrl+C");
  };
  if (!$("#pn").open) $("#pn").showModal();
}
$("#pncount").onchange = () => paintNext(pnFor);
$("#pnx").onclick = () => $("#pn").close();
$("#pn").addEventListener("click", e => { if (e.target === $("#pn")) $("#pn").close(); });

// ---------- share card: a 1200 x 630 image of a country (or the world) and its progress
const loadImg = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = src; });
async function shareCard(R) {
  const cv = document.createElement("canvas"); cv.width = 1200; cv.height = 630;
  const g = cv.getContext("2d");
  g.fillStyle = "#efebe1"; g.fillRect(0, 0, 1200, 630);
  g.strokeStyle = "#141414"; g.lineWidth = 3; g.strokeRect(24, 24, 1152, 582);
  g.strokeStyle = "#d6d0c2"; g.lineWidth = 1; g.strokeRect(34, 34, 1132, 562);
  let done, total, part, title, sub;
  if (R) ({done, total, part} = R.s), title = R.name;
  else {
    done = 0; part = 0; total = WORLD.species.length;
    WORLD.slugs.forEach(sl => { const st = paintState(sl); if (st === "ok") done++; else if (st === "part") part++; });
    title = "The World";
  }
  const share = total ? done / total : 0;
  sub = `${fmt(done)} of ${fmt(total)} eBird species illustrated`;
  // map: the country fitted into the right half, or the whole shaded world
  const mapBox = [[620, 70], [1140, 420]];
  const pj = d3.geoEqualEarth(), gp = d3.geoPath(pj, g);
  const feats = Object.values(C).filter(c => c.f);
  if (R && R.f) {
    pj.rotate([-d3.geoCentroid(R.f)[0], 0]).fitExtent(mapBox, R.f);
    g.beginPath(); gp(R.f); g.fillStyle = shade(R.s); g.fill(); g.strokeStyle = "#141414"; g.lineWidth = 1.5; g.stroke();
  } else {
    pj.fitExtent(mapBox, {type: "Sphere"});
    g.beginPath(); gp({type: "Sphere"}); g.fillStyle = "#f2eee4"; g.fill(); g.strokeStyle = "#3a352c"; g.lineWidth = 1; g.stroke();
    for (const c of feats) { g.beginPath(); gp(c.f); g.fillStyle = c.s.done + c.s.part ? shade(c.s) : "#e2dac7"; g.fill(); g.strokeStyle = "#3a352c"; g.lineWidth = .4; g.stroke(); }
  }
  // text
  g.fillStyle = "#6b665c"; g.font = "16px 'Courier New', monospace"; g.fillText("BIRD ATLAS · KACHŌ-E FIELD GUIDES", 64, 92);
  g.fillStyle = "#141414"; g.font = `bold ${title.length > 18 ? 46 : 60}px Georgia, serif`; g.fillText(title, 64, 160, 540);
  g.font = "bold 96px Georgia, serif"; g.fillStyle = "#8a2a18";
  g.fillText(`${pct({done, total})}%`, 64, 280);
  g.fillStyle = "#141414"; g.font = "22px Georgia, serif"; g.fillText(sub, 64, 322, 540);
  // progress bar in the dotted style
  for (let x = 64; x < 584; x += 4) { g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(x, 344, 2, 14); }
  g.fillStyle = "#141414"; g.fillRect(64, 344, 520 * share, 14);
  // a row of painted birds from this place
  const pool = (R ? checklist(R).birds : Object.keys(PAINTED).map(slug => ({slug, webp: PAINTED[slug], wide: 0})))
    .filter(b => b.webp && b.webp.length).sort((a, b) => (b.wide || 0) - (a.wide || 0)).slice(0, 7);
  const ims = await Promise.all(pool.map(b => loadImg("birds/" + (b.webp.includes(b.slug + ".webp") ? b.slug + ".webp" : b.webp[0]))));
  let x = 64;
  g.globalCompositeOperation = "multiply";
  for (const im of ims.filter(Boolean)) {
    const h = 120, w = Math.min(150, im.width * h / im.height);
    g.drawImage(im, x, 440 + (120 - Math.min(h, im.height * w / im.width)), w, Math.min(h, im.height * w / im.width));
    x += w + 14; if (x > 1100) break;
  }
  g.globalCompositeOperation = "source-over";
  g.fillStyle = "#6b665c"; g.font = "15px 'Courier New', monospace";
  g.fillText(location.host + location.pathname + (R ? "#" + R.code : ""), 64, 590);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const name = `bird-atlas-${R ? R.code.toLowerCase() : "world"}.png`, file = new File([blob], name, {type: "image/png"});
  if (navigator.canShare && navigator.canShare({files: [file]}) && lastPointer === "touch") {
    try { await navigator.share({files: [file], title: `Bird Atlas: ${title}`, text: sub}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
document.querySelectorAll("button.f").forEach(x => x.onclick = () => {
  document.querySelectorAll("button.f").forEach(y => y.classList.remove("on")); x.classList.add("on"); f = x.dataset.f; draw(); });
$("#q").oninput = e => { q = e.target.value.toLowerCase(); draw(); };
$("#back").onclick = () => closeRegion();
window.addEventListener("popstate", () => { const c = location.hash.slice(1); c ? openRegion(c) : closeRegion(false); });

drawMap().then(() => { const c = location.hash.slice(1); if (c) openRegion(c); });
</script>
