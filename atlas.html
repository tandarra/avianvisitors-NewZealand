<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bird Atlas</title>
<meta name="description" content="Kachō-e style bird illustrations by region. Pick a country to see its checklist and what's been painted.">
<style>
:root{--paper:#efebe1;--paper2:#f6f3ea;--land:#e2dac7;--ink:#141414;--ink2:#3a352c;--mute:#6b665c;--line:#d6d0c2;
--ok:#2f6b3a;--part:#a8741a;--miss:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{border-bottom:3px solid var(--ink);padding:22px 0 14px;position:relative;overflow:hidden}
header.top h1{margin:0;font-size:34px;letter-spacing:.01em}
.kicker,.sub{font:12px 'Courier New',monospace;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.sub{margin-top:6px}
header.top img.flier{position:absolute;right:8px;top:6px;height:88px;mix-blend-mode:multiply;transform:scaleX(-1);opacity:.95}
.mapbox{margin:18px 0 10px;border:1px solid var(--ink2);background:var(--paper2);padding:10px;position:relative}
.mapbox::after{content:"";position:absolute;inset:4px;border:1px solid var(--line);pointer-events:none}
#mapwrap{position:relative;width:100%;aspect-ratio:1000/439;overflow:hidden}
#mapwrap svg{width:100%;height:100%;display:block}
.sea{fill:url(#waves);stroke:var(--ink2);stroke-width:.8}
.grat{fill:none;stroke:#b9b09c;stroke-width:.35;stroke-dasharray:2 3}
#land path{fill:var(--land);stroke:var(--ink2);stroke-width:.35;stroke-linejoin:round;transition:stroke-width .2s,fill .2s,filter .2s}
#land path.hov{stroke:var(--ink);stroke-width:1.6;fill:#efe6cf;filter:drop-shadow(0 1.5px 0 rgba(20,20,20,.35))}
#land path.live.hov{stroke:var(--ink);stroke-width:1.8;filter:drop-shadow(0 1.5px 0 rgba(20,20,20,.35))}
.bird,.bird-shadow{pointer-events:none;opacity:0;transition:opacity .35s}
.bird.up{opacity:1}.bird-shadow.up{opacity:var(--o,.2)}
.bird{filter:drop-shadow(0 .5px 0 rgba(20,20,20,.25))}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--paper2);border:1px solid var(--ink);
padding:4px 8px;font:11px 'Courier New',monospace;color:var(--mute);white-space:nowrap;z-index:2;box-shadow:2px 2px 0 rgba(20,20,20,.2)}
.tip b{display:block;font:700 14px Georgia,serif;color:var(--ink)}

.hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:12px 'Courier New',monospace;color:var(--mute);align-items:center;margin:2px 0 6px}
#land path.live{fill:var(--fill);stroke:var(--ink);stroke-width:.7;cursor:pointer}
.legend{margin:4px 0 28px;gap:8px}.legend .ramp{display:inline-block;width:160px;height:10px;border:1px solid var(--ink)}
.legend .hint{margin-left:auto}
/* checklist panel */
#panel[hidden]{display:none}
#panel header{position:sticky;top:0;background:var(--paper);border-bottom:3px solid var(--ink);padding:14px 0 12px;z-index:3}
#panel h2{margin:0;font-size:28px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
#panel h2 small{font:12px 'Courier New',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:400}
.bar{height:10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.f,input,button.back{font:13px 'Courier New',monospace;border:1px solid var(--ink);background:transparent;padding:5px 10px;color:var(--ink);cursor:pointer}
button.f.on{background:var(--ink);color:var(--paper)}
input{flex:1;min-width:160px;cursor:text}
button.back{margin-right:4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:16px 0 40px}
.c{border:1px solid var(--line);background:var(--paper2);padding:10px;display:flex;flex-direction:column;gap:6px}
.imgs{display:flex;gap:4px;height:84px;align-items:center;justify-content:center}
.imgs img{max-height:84px;max-width:50%;object-fit:contain;mix-blend-mode:multiply}
.ph{width:60px;height:60px;border:1px dashed var(--line)}
.n{font-weight:700;font-size:15px;line-height:1.15}.s{font-style:italic;font-size:12px;color:var(--mute)}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips span{font:10px 'Courier New',monospace;border:1px solid currentColor;padding:1px 5px;text-transform:uppercase}
.ok{color:var(--ok)}.part{color:var(--part)}.miss{color:var(--miss)}
.empty{font:13px 'Courier New',monospace;color:var(--mute);padding:20px 0}
footer{border-top:1px solid var(--line);padding:14px 0 30px;font:12px 'Courier New',monospace;color:var(--mute)}
@media (max-width:640px){header.top h1{font-size:26px}header.top img.flier{height:60px}.legend .hint{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">Kachō-e field guides</div>
    <h1>Bird Atlas</h1>
    <div class="sub" id="tag">Click a shaded country to open its checklist</div>
    <img class="flier" src="birds/prosthemadera-novaeseelandiae-2.webp" alt="">
  </header>

  <section id="atlas">
    <div class="mapbox"><div id="mapwrap" aria-busy="true"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="panel" hidden>
    <header>
      <h2><span id="pname"></span><small id="psub"></small></h2>
      <div class="bar"><i id="pbar"></i></div>
      <div class="tools">
        <button class="back" id="back">&larr; Map</button>
        <button class="f on" data-f="all">All</button><button class="f" data-f="ok">Complete</button>
        <button class="f" data-f="part">Partial</button><button class="f" data-f="miss">Missing</button>
        <input id="q" placeholder="Search name..." aria-label="Search species">
      </div>
    </header>
    <main id="grid"></main>
  </section>

  <footer>Illustrations generated in the style of <a href="https://theodore.net/projects/AvianVisitors/">Avian Visitors</a> &middot;
    CC BY-NC-SA 4.0 &middot; Species lists from eBird &middot; Map: Natural Earth &middot;
    <a href="https://github.com/tandarra/avianvisitors-NewZealand">GitHub</a></footer>
</div>

<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
// Countries with birds. To add one: build birds/progress_<code>.json with --progress --region <code>
// and add a line here (ids = ISO 3166 numeric codes of the map shapes it covers; at = tap target).
const REGIONS = [
  {code: "NZ", name: "New Zealand", ids: ["554"], at: [172.5, -41.5]},
];
const NS = "http://www.w3.org/2000/svg";
// Overhead albatross (mollymawk), drawn facing +x: long narrow dark wings, white body, grey head, yellow bill.
const ALBATROSS = `
<g class="wing"><path d="M3,-2.2 C4.6,-8 5.6,-12 5,-15.5 C3.6,-22 0.6,-29 -3.8,-35.5 C-4.6,-36.3 -5.4,-35.6 -5,-34.6
 C-4.2,-28 -4.6,-21 -4.8,-15.8 C-4.9,-10 -4.6,-6 -4.2,-2.2 Z" fill="#2c2a26" stroke="#141414" stroke-width=".5"/>
 <path d="M2.6,-3 C3.8,-8 4.4,-11.5 3.9,-14.6 L-2.6,-14.2 C-3,-10 -3,-6 -2.8,-3 Z" fill="#4a4640"/>
 <path d="M-4.6,-16 C-4.4,-22 -3.6,-28 -4.4,-34" fill="none" stroke="#efebe1" stroke-width=".35" opacity=".45"/></g>
<g class="wing"><path d="M3,2.2 C4.6,8 5.6,12 5,15.5 C3.6,22 0.6,29 -3.8,35.5 C-4.6,36.3 -5.4,35.6 -5,34.6
 C-4.2,28 -4.6,21 -4.8,15.8 C-4.9,10 -4.6,6 -4.2,2.2 Z" fill="#2c2a26" stroke="#141414" stroke-width=".5"/>
 <path d="M2.6,3 C3.8,8 4.4,11.5 3.9,14.6 L-2.6,14.2 C-3,10 -3,6 -2.8,3 Z" fill="#4a4640"/>
 <path d="M-4.6,16 C-4.4,22 -3.6,28 -4.4,34" fill="none" stroke="#efebe1" stroke-width=".35" opacity=".45"/></g>
<path d="M-12.5,-2 L-9,-1.4 L-9,1.4 L-12.5,2 C-13.2,0.8 -13.2,-0.8 -12.5,-2 Z" fill="#3a3732" stroke="#141414" stroke-width=".4"/>
<path d="M9.2,-1.8 C10.6,-1.6 11.4,-0.8 11.6,0 C11.4,0.8 10.6,1.6 9.2,1.8 C3,2.9 -4,3.1 -9.6,1.7 C-10.6,1 -10.6,-1 -9.6,-1.7
 C-4,-3.1 3,-2.9 9.2,-1.8 Z" fill="#f6f3ea" stroke="#141414" stroke-width=".5"/>
<path d="M-3.6,-2.6 C-0.6,-2.9 2.4,-2.7 3.2,-2.2 L3.2,2.2 C2.4,2.7 -0.6,2.9 -3.6,2.6 Z" fill="#3a3732"/>
<path d="M5.2,-2.3 C7.8,-2.2 9.8,-1.6 11,-0.6 L11,0.6 C9.8,1.6 7.8,2.2 5.2,2.3 Z" fill="#b9b7b1"/>
<path d="M11.2,-0.75 C13,-0.6 15,-0.3 16.2,0 C15,0.3 13,0.6 11.2,0.75 Z" fill="#e0a52a" stroke="#141414" stroke-width=".3"/>
<circle cx="10.2" cy="-1.05" r=".38" fill="#141414"/><circle cx="10.2" cy="1.05" r=".38" fill="#141414"/>`;
const progress = {};          // code -> loaded progress json
const $ = s => document.querySelector(s);

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

async function loadProgress(code) {
  if (progress[code]) return progress[code];
  const r = await fetch(`birds/progress_${code}.json`, {cache: "no-cache"});
  if (!r.ok) throw new Error(r.status);
  return progress[code] = await r.json();
}

// shade = share of the checklist painted (partials count half): pale wash -> deep vermilion
const SHADE = ["#f1d9cc", "#e3a98f", "#cf7356", "#b8432b", "#8a2a18"];
function shade(p) {
  const t = Math.max(0, Math.min(1, (p.done + p.part / 2) / p.total)) * (SHADE.length - 1);
  const i = Math.min(SHADE.length - 2, Math.floor(t)), f = t - i;
  const c = k => parseInt(SHADE[i].slice(k, k + 2), 16) * (1 - f) + parseInt(SHADE[i + 1].slice(k, k + 2), 16) * f;
  return `rgb(${c(1) | 0},${c(3) | 0},${c(5) | 0})`;
}
const pct = p => Math.round(p.done / p.total * 100);

// ---------- live map: turns toward the country under the mouse, zooms a touch, inks its border
const W = 1000, ZOOM = 1.18, DUR = 850;
const calm = matchMedia("(prefers-reduced-motion: reduce)");
const view = {lam: 0, k: 1, focus: [0, 0]};          // current rotation, zoom and zoom centre (lon/lat)
let proj, path, H, base, render = () => {};

async function drawMap() {
  const wrap = $("#mapwrap");
  const topo = await (await fetch("birds/world-110m.json")).json();
  await Promise.all(REGIONS.map(R => loadProgress(R.code).then(p => R.p = p).catch(() => null)));
  const live = REGIONS.filter(R => R.p);
  const countries = topojson.feature(topo, topo.objects.countries).features.filter(f => f.id !== "010");
  const byId = Object.fromEntries(countries.map(f => [f.id, f]));

  // fit: whole world across 1000 units, crop the far south (no Antarctica)
  proj = d3.geoEqualEarth().fitWidth(W, {type: "Sphere"});
  const top = proj([0, 90])[1], bottom = proj([0, -58])[1];
  base = {scale: proj.scale(), tx: proj.translate()[0], ty: proj.translate()[1] - top};
  H = Math.round(bottom - top);
  path = d3.geoPath(proj);
  wrap.style.aspectRatio = `${W}/${H}`;

  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "World map"});
  wrap.innerHTML = ""; wrap.appendChild(svg);
  const tip = document.createElement("div"); tip.className = "tip"; wrap.appendChild(tip);

  // woodblock texture: seigaiha-ish waves for the sea
  const defs = el("defs", {}, svg);
  const w = el("pattern", {id: "waves", width: 14, height: 7, patternUnits: "userSpaceOnUse"}, defs);
  el("rect", {width: 14, height: 7, fill: "#f2eee4"}, w);
  el("path", {d: "M0 7 A7 7 0 0 1 14 7 M3 7 A4 4 0 0 1 11 7", fill: "none", stroke: "#cfd6d6", "stroke-width": .5}, w);

  const sea = el("path", {class: "sea"}, svg);
  const grat = el("path", {class: "grat"}, svg);
  const graticule = d3.geoGraticule().step([30, 30])();
  const land = el("g", {id: "land"}, svg);
  const regionOf = {};
  live.forEach(R => R.ids.forEach(id => regionOf[id] = R));
  const paths = countries.map(f => {
    const R = regionOf[f.id];
    const p = el("path", R ? {class: "live", style: `--fill:${shade(R.p)}`} : {}, land);
    p.__f = f; p.__R = R; p.__name = R ? R.name : f.properties.name;
    if (R) p.addEventListener("click", () => openRegion(R.code));
    return p;
  });
  // keep coloured countries on top so their bold border isn't covered by neighbours
  paths.filter(p => p.__R).forEach(p => land.appendChild(p));
  // generous tap target for small countries
  const over = el("g", {}, svg);
  // the albatross: overhead view, flying along the great circle while the map turns underneath
  const shadow = el("g", {class: "bird-shadow"}, svg), bird = el("g", {class: "bird"}, svg);
  shadow.innerHTML = ALBATROSS.replace(/fill="[^"]*"/g, 'fill="#141414"').replace(/stroke="[^"]*"/g, 'stroke="none"');
  bird.innerHTML = ALBATROSS;
  const wingsOf = g => [...g.querySelectorAll(".wing")];
  const flight = {on: false, e: 0, interp: null, heading: 0};
  for (const R of live) {
    R.hit = el("circle", {r: 22, class: "hit"}, over);
    R.hit.__R = R; R.hit.__name = R.name; R.hit.__f = byId[R.ids[0]];
    R.hit.addEventListener("click", () => openRegion(R.code));
  }

  render = () => {
    // rotate, then scale about the focus point so it stays put while the map zooms
    proj.rotate([view.lam, 0]).scale(base.scale).translate([base.tx, base.ty]);
    const p0 = proj(view.focus) || [W / 2, H / 2];
    proj.scale(base.scale * view.k).translate([p0[0] - view.k * (p0[0] - base.tx), p0[1] - view.k * (p0[1] - base.ty)]);
    sea.setAttribute("d", path({type: "Sphere"}));
    grat.setAttribute("d", path(graticule));
    for (const p of paths) p.setAttribute("d", path(p.__f) || "");
    for (const R of live) { const a = proj(R.at); if (a) { R.hit.setAttribute("cx", a[0]); R.hit.setAttribute("cy", a[1]); } }
    if (flight.on) {
      const e = flight.e, a = proj(flight.interp(e)), b = proj(flight.interp(Math.min(1, e + .02)));
      if (a && b && Math.hypot(b[0] - a[0], b[1] - a[1]) > .05) flight.heading = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
      if (a) {
        const alt = Math.sin(Math.PI * e), sc = (.8 + .45 * alt) * Math.min(1.25, view.k);
        // slow dynamic-soaring wing flex: mostly gliding, a gentle beat now and then
        const flex = 1 - .1 * Math.pow(Math.sin(performance.now() / 260), 8);
        const at = `translate(${a[0].toFixed(1)},${a[1].toFixed(1)}) rotate(${flight.heading.toFixed(1)}) scale(${sc.toFixed(3)})`;
        bird.setAttribute("transform", at);
        shadow.setAttribute("transform", `translate(${(a[0] + 3 + 14 * alt).toFixed(1)},${(a[1] + 4 + 20 * alt).toFixed(1)}) rotate(${flight.heading.toFixed(1)}) scale(${(sc * .92).toFixed(3)})`);
        shadow.style.setProperty("--o", (.24 - .1 * alt).toFixed(2));
        for (const w of [...wingsOf(bird), ...wingsOf(shadow)]) w.setAttribute("transform", `scale(1,${flex.toFixed(3)})`);
      }
    }
  };
  render();

  // legend: the shading scale
  $("#legend").innerHTML = `<span>Illustrated: 0%</span><i class="ramp" style="background:linear-gradient(90deg,${SHADE.join(",")})"></i>
    <span>100%</span><span class="hint">Hover a country &middot; click a shaded one to open its checklist</span>`;

  // ---- hover: ink the border at once; turn + zoom after a short dwell, only when the mouse itself moved
  let hoverNode = null, hovered = null, dwell = null, leaveT = null, lastMove = 0, animEnd = 0, anim = null;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let birdAt = REGIONS[0].at, fadeT = null;          // where the albatross last landed (starts at home)
  function animateTo(lam, k, focus, fly) {
    cancelAnimationFrame(anim);
    const from = {...view}, d = ((lam - from.lam + 540) % 360) - 180, t0 = performance.now();
    if (focus) view.focus = focus;
    let dur = DUR;
    if (fly) {
      const start = flight.on ? flight.interp(flight.e) : birdAt;     // mid-air re-route starts where it is
      const dist = d3.geoDistance(start, fly);
      if (dist > .03) {
        Object.assign(flight, {on: true, e: 0, interp: d3.geoInterpolate(start, fly)});
        dur = 1000 + 1100 * Math.min(1, dist / Math.PI);
        clearTimeout(fadeT); bird.classList.add("up"); shadow.classList.add("up");
      }
      birdAt = fly;
    }
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = ease(t);
      view.lam = from.lam + d * e; view.k = from.k + (k - from.k) * e;
      if (flight.on) flight.e = e;
      render();
      if (t < 1) anim = requestAnimationFrame(step);
      else {
        animEnd = performance.now();
        if (flight.on) fadeT = setTimeout(() => { bird.classList.remove("up"); shadow.classList.remove("up");
          setTimeout(() => flight.on = false, 400); }, 250);
      }
    };
    anim = requestAnimationFrame(step);
  }
  function setHover(node) {
    if (hoverNode === node) return;
    if (hovered) hovered.classList.remove("hov");
    hoverNode = hovered = node;
    clearTimeout(dwell);
    if (!node) { tip.style.opacity = 0; return; }
    const p = node.parentNode === land ? node : paths.find(x => x.__R === node.__R);
    if (p) { p.classList.add("hov"); land.appendChild(p); hovered = p; }
    const R = node.__R;
    tip.innerHTML = `<b>${node.__name}</b>` + (R ? `${R.p.done} of ${R.p.total} species illustrated (${pct(R.p)}%)<br>click to open checklist` : "");
    tip.style.opacity = 1;
    dwell = setTimeout(() => {
      if (lastMove < animEnd || calm.matches) return;   // don't chase when the map moved under a still mouse
      const c = d3.geoCentroid(node.__f);
      animateTo(-c[0], ZOOM, c, c);
    }, 160);
  }
  svg.addEventListener("pointermove", ev => {
    lastMove = performance.now(); clearTimeout(leaveT);
    const r = wrap.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top, tw = tip.offsetWidth || 160;
    tip.style.left = (x + 14 + tw > r.width ? x - 14 - tw : x + 14) + "px";
    tip.style.top = (y + 70 > r.height ? y - 60 : y + 14) + "px";
    const t = ev.target;
    setHover(t && t.__f ? t : null);
  });
  svg.addEventListener("pointerleave", () => {
    setHover(null);
    leaveT = setTimeout(() => animateTo(0, 1, null), 500);
  });
  wrap.removeAttribute("aria-busy");
}

// ---------- checklist panel
let cur = null, f = "all", q = "";
async function openRegion(code) {
  const R = REGIONS.find(r => r.code === code);
  if (!R) return;
  if (location.hash !== "#" + code) history.pushState(null, "", "#" + code);
  let p;
  try { p = await loadProgress(code); } catch (e) { alert("Couldn't load the " + R.name + " checklist."); return; }
  cur = p; f = "all"; q = ""; $("#q").value = "";
  document.querySelectorAll("button.f").forEach(b => b.classList.toggle("on", b.dataset.f === "all"));
  $("#pname").textContent = R.name;
  const when = new Date(p.updated).toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
  $("#psub").textContent = `${p.done} of ${p.total} complete · ${p.part} partial · ${p.miss} not started · ${p.images} images · updated ${when}`;
  $("#pbar").style.width = (p.done / p.total * 100).toFixed(1) + "%";
  $("#atlas").hidden = true; $("#panel").hidden = false; $("#tag").textContent = R.name + " checklist";
  draw(); window.scrollTo(0, 0);
}
function closeRegion(push = true) {
  if (push) history.pushState(null, "", location.pathname);
  $("#panel").hidden = true; $("#atlas").hidden = false; $("#tag").textContent = "Click a shaded country to open its checklist";
}
function draw() {
  const list = cur.birds.filter(b => (f === "all" || b.status === f) && (b.com + " " + b.sci).toLowerCase().includes(q));
  $("#grid").innerHTML = list.length ? list.map(b => `
    <div class="c"><div class="imgs">${b.webp.length ? [...b.webp].sort((x, y) => (x === b.slug + ".webp" ? -1 : y === b.slug + ".webp" ? 1 : x < y ? -1 : 1)).slice(0, 3).map(w => `<img loading="lazy" src="birds/${w}" alt="">`).join("") : '<div class="ph"></div>'}</div>
    <div class="n">${b.com}</div><div class="s">${b.sci}</div><div class="chips">
    <span class="${b.webp.includes(b.slug + ".webp") ? "ok" : "miss"}">perched</span>
    <span class="${b.webp.includes(b.slug + "-2.webp") ? "ok" : "miss"}">${b.pose2}</span></div></div>`).join("")
    : '<div class="empty">No species match.</div>';
}
document.querySelectorAll("button.f").forEach(x => x.onclick = () => {
  document.querySelectorAll("button.f").forEach(y => y.classList.remove("on")); x.classList.add("on"); f = x.dataset.f; draw(); });
$("#q").oninput = e => { q = e.target.value.toLowerCase(); draw(); };
$("#back").onclick = () => closeRegion();
window.addEventListener("popstate", () => { const c = location.hash.slice(1); c ? openRegion(c) : closeRegion(false); });

drawMap().then(() => { const c = location.hash.slice(1); if (c) openRegion(c); });
